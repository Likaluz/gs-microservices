events {}

http {
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

  upstream ingest_service {
    server ingest-service:3001;
  }

  upstream alert_service {
    server alert-service:3002;
  }

  server {
    listen 80;

    location /api/ingest/ {
      limit_req zone=api_limit burst=10 nodelay;
      proxy_pass http://ingest_service/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/alerts {
      limit_req zone=api_limit burst=10 nodelay;
      proxy_pass http://alert_service/alerts;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health {
      return 200 "solar-shield gateway ok\n";
    }
  }
}
